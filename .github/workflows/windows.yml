name: Windows test build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run prepare:model
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run make -- --platform win32 --arch x64
      - name: Check packaged file scope
        run: |
          node --input-type=module -e "import { listPackage } from '@electron/asar'; import assert from 'node:assert/strict'; const files = listPackage('out/Sketch Cleaner-win32-x64/resources/app.asar'); assert(files.includes('/dist/main/main.js')); assert(!files.some(file => /^\/(?:\.scratch|projects|src|tests|e2e|artifacts|coverage|test-results|playwright-report)(?:\/|$)/.test(file) || /^\/\.env(?:\.|$)/.test(file)), 'Private or development files in app.asar');"
      - name: Check packaged native image libraries
        shell: pwsh
        run: |
          $native = "out/Sketch Cleaner-win32-x64/resources/app.asar.unpacked/node_modules/@img"
          if (!(Get-ChildItem $native -Recurse -Filter *.node)) { throw "Native image decoder missing" }
          if (!(Get-ChildItem $native -Recurse -Filter *vips*.dll)) { throw "Image decoder DLL missing" }
          $ort = "out/Sketch Cleaner-win32-x64/resources/app.asar.unpacked/node_modules/onnxruntime-node/bin/napi-v6/win32/x64"
          if (!(Get-ChildItem $ort -Filter *.node)) { throw "ONNX native binding missing" }
          if (!(Test-Path "$ort/onnxruntime.dll")) { throw "ONNX runtime DLL missing" }
          $manifest = Get-Content models/model.json -Raw | ConvertFrom-Json
          $model = "out/Sketch Cleaner-win32-x64/resources/models/text-det.onnx"
          if ((Get-FileHash $model -Algorithm SHA256).Hash.ToLower() -ne $manifest.sha256) { throw "Bundled model checksum mismatch" }
      - name: Install and verify data separation
        shell: pwsh
        run: |
          $identity = node -p "require('./forge.config.cjs').makers[0].config.name"
          $installRoot = Join-Path $env:LOCALAPPDATA $identity
          $dataRoot = Join-Path $env:LOCALAPPDATA "SketchCleaner/projects"
          if ($dataRoot.StartsWith($installRoot + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) { throw "Project data must be outside the installer directory" }
          New-Item $dataRoot -ItemType Directory -Force | Out-Null
          $marker = Join-Path $dataRoot "installer-preservation-check.txt"
          Set-Content $marker "Preserve projects across installation and removal" -NoNewline
          $markerHash = (Get-FileHash $marker -Algorithm SHA256).Hash
          $version = node -p "require('./package.json').version"
          $setup = (Get-ChildItem out/make -Recurse -Filter "SketchCleaner-$version-Setup.exe" | Select-Object -First 1).FullName
          if (!$setup) { throw "Installer missing" }
          $result = Start-Process $setup -ArgumentList "--silent" -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Installer failed: $($result.ExitCode)" }
          $executable = (Get-ChildItem "$installRoot/app-*/SketchCleaner.exe" | Select-Object -First 1).FullName
          if (!$executable) { throw "Installed executable missing" }
          if ((Get-FileHash $marker -Algorithm SHA256).Hash -ne $markerHash) { throw "Installation modified project data" }
          $shell = New-Object -ComObject WScript.Shell
          $programs = Join-Path $env:APPDATA "Microsoft/Windows/Start Menu/Programs"
          $shortcuts = @(Get-ChildItem $programs -Recurse -Filter *.lnk | Where-Object { $shell.CreateShortcut($_.FullName).TargetPath.StartsWith($installRoot, [StringComparison]::OrdinalIgnoreCase) })
          if (!$shortcuts.Count) { throw "Start menu shortcut missing" }
          $registry = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$identity"
          if (!(Test-Path $registry)) { throw "Uninstall registration missing" }
          "SKETCH_INSTALLER=$setup" >> $env:GITHUB_ENV
          "SKETCH_INSTALL_ROOT=$installRoot" >> $env:GITHUB_ENV
          "SKETCH_TEST_EXECUTABLE=$executable" >> $env:GITHUB_ENV
          "SKETCH_DATA_MARKER=$marker" >> $env:GITHUB_ENV
          "SKETCH_DATA_MARKER_HASH=$markerHash" >> $env:GITHUB_ENV
          "SKETCH_UNINSTALL_REGISTRY=$registry" >> $env:GITHUB_ENV
          "SKETCH_STARTMENU_SHORTCUT=$($shortcuts[0].FullName)" >> $env:GITHUB_ENV
      - name: Test the installed desktop app
        run: npm run test:e2e
      - name: Reinstall and uninstall without deleting project data
        if: always() && env.SKETCH_INSTALL_ROOT != ''
        shell: pwsh
        run: |
          $result = Start-Process $env:SKETCH_INSTALLER -ArgumentList "--silent" -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Reinstallation failed: $($result.ExitCode)" }
          if ((Get-FileHash $env:SKETCH_DATA_MARKER -Algorithm SHA256).Hash -ne $env:SKETCH_DATA_MARKER_HASH) { throw "Reinstallation modified project data" }
          $updater = Join-Path $env:SKETCH_INSTALL_ROOT "Update.exe"
          $result = Start-Process $updater -ArgumentList "--uninstall", "--silent" -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Uninstall failed: $($result.ExitCode)" }
          if ((Get-FileHash $env:SKETCH_DATA_MARKER -Algorithm SHA256).Hash -ne $env:SKETCH_DATA_MARKER_HASH) { throw "Uninstall modified project data" }
          if (Test-Path $env:SKETCH_UNINSTALL_REGISTRY) { throw "Uninstall registration remains" }
          if (Test-Path $env:SKETCH_STARTMENU_SHORTCUT) { throw "Start menu shortcut remains" }
          if (!(Test-Path (Join-Path $env:SKETCH_INSTALL_ROOT ".dead"))) { throw "Squirrel uninstall completion marker missing" }
          New-Item test-results -ItemType Directory -Force | Out-Null
          $remaining = @(Get-ChildItem "$env:SKETCH_INSTALL_ROOT/app-*/SketchCleaner.exe" -ErrorAction SilentlyContinue)
          $remaining.FullName | Set-Content test-results/uninstall-remaining-files.txt
          if ($remaining.Count) { Write-Warning "Squirrel completed uninstall but could not remove locked installation files. Project data is preserved separately." }
          foreach ($folder in @($env:SKETCH_INSTALL_ROOT, (Join-Path $env:LOCALAPPDATA "SquirrelTemp"))) {
            $log = Join-Path $folder "SquirrelSetup.log"
            if (Test-Path $log) { Copy-Item $log "test-results/$((Split-Path $folder -Leaf))-setup.log" }
          }
      - name: Preserve source history for local synchronization
        if: always()
        run: git bundle create source-history.bundle --all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-verification-evidence
          path: |
            test-results/**
            source-history.bundle
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: SketchCleaner-Windows-x64-TEST-unsigned
          path: out/make/**
          if-no-files-found: error
          retention-days: 14
